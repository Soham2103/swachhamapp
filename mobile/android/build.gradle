// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    /*
     * FIREBASE CLOUD MESSAGING.
     *
     * Added by hand because this project has a CHECKED-IN `android/`
     * directory. Expo's config plugins — including the one that would
     * normally act on `googleServicesFile` in app.json — run during
     * `prebuild`, not during a build of an existing native project, so that
     * setting is ignored here and the wiring has to live in Gradle.
     *
     * This plugin reads `android/app/google-services.json` and turns it into
     * the resources the FCM SDK reads at runtime. WITHOUT IT the app builds
     * perfectly and simply never receives a push, which is the failure this
     * is easiest to waste a day on.
     */
    classpath('com.google.gms:google-services:4.4.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
